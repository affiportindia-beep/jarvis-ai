name: Build APK

# Builds the debug APK on GitHub's free runners, runs the unit tests and the
# API-independence check, and publishes the APK as the "latest-debug" release
# so it can be downloaded directly on the phone.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: API-independence check (no cloud AI, network only in ModelDownloader)
        run: ./scripts/check_no_cloud.sh

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install NDK and CMake (runner's preinstalled Android SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.13113456" "cmake;3.31.6" "platforms;android-35" "build-tools;35.0.0" | tail -3
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache llama.cpp source
        uses: actions/cache@v4
        with:
          path: external/llama.cpp
          key: llama-${{ hashFiles('scripts/llama_cpp_tag.txt') }}

      - name: Fetch llama.cpp at the pinned tag
        run: ./scripts/fetch_llama.sh

      - name: Fetch live search responses for the parser test
        run: |
          mkdir -p "$RUNNER_TEMP/research"
          curl -sSf -A "JarvisX-CI" "https://news.google.com/rss/search?q=India&hl=en-IN&gl=IN&ceid=IN:en" -o "$RUNNER_TEMP/research/news.xml" || echo "::warning::Google News fetch failed"
          curl -sSf -A "JarvisX-CI" "https://en.wikipedia.org/w/rest.php/v1/search/page?q=Kapil%20Sharma&limit=3" -o "$RUNNER_TEMP/research/wiki.json" || echo "::warning::Wikipedia fetch failed"
          echo "RESEARCH_FIXTURE_DIR=$RUNNER_TEMP/research" >> "$GITHUB_ENV"

      - name: Unit tests (core)
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Load stable signing key (if configured)
        env:
          KS_B64: ${{ secrets.JARVISX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | tr -d " \r\n" | base64 -d > "$RUNNER_TEMP/jarvisx.keystore"
            echo "JARVISX_KEYSTORE_PATH=$RUNNER_TEMP/jarvisx.keystore" >> "$GITHUB_ENV"
            echo "Stable signing key loaded."
          else
            echo "::warning::No JARVISX_KEYSTORE_B64 secret: this APK uses a one-off debug key and cannot update an existing install."
          fi

      - name: Build debug APK
        env:
          JARVISX_KEYSTORE_PASSWORD: ${{ secrets.JARVISX_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-256|DN" | head -2

      - name: Inspect APK (size, ABIs, permissions)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*\.so' | awk '{print $1, $4}'
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump permissions "$APK" || true
          echo "### APK" >> $GITHUB_STEP_SUMMARY
          echo "Size: $(du -h $APK | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          $AAPT dump permissions "$APK" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-x-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/
          retention-days: 14

      - name: Publish a numbered release (main branch only)
        # Each build gets its own release; nothing is deleted, so a download in progress
        # never loses its file. The newest is always at /releases/latest/download/jarvis-x-debug.apk
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk jarvis-x-debug.apk
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" jarvis-x-debug.apk \
            --latest \
            --target "${GITHUB_SHA}" \
            --title "JARVIS X debug build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes "Debug build of commit ${GITHUB_SHA}. For 64-bit ARM phones with Android 11+. Install steps: see docs/INSTALL.md."
